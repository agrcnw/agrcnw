<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="IT experience: Huawei switches, Ubiquiti, Fortinet firewalls, Kaspersky Antivirus, Office 365, 1st to 3rd level support, PC building, server setups, Synology NAS, backup solutions">
